events {}

http {
    upstream suxen_replicas {
        least_conn;
        server suxen-a:8080 max_fails=1 fail_timeout=2s;
        server suxen-b:8080 max_fails=1 fail_timeout=2s;
        server suxen-c:8080 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;
        client_max_body_size 20m;

        location / {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            # A stopped replica's container IP stops answering, so SYNs to it are
            # dropped rather than refused; without a short connect timeout nginx
            # waits the 60s default before failing over. Bound it so failover to a
            # healthy replica is prompt. This caps only connection setup, not the
            # response read, so healthy slow responses are unaffected.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://suxen_replicas;
        }
    }
}
