apiVersion: suxen.io/v1
resources:
  # A hosted raw repository for signed release artifacts. Its trust policy is set
  # at runtime (see the README / test): the cosign key pair is generated by the
  # operator, so the public key cannot be committed here — the same reason the
  # trust-policy example uses an unmanaged repository.
  - kind: repository
    name: releases
    spec:
      format: raw
      type: hosted
