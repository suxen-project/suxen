# A dedicated support stack for the s3 example: a single MinIO server that
# provides an S3-compatible object store on localhost:9000. suxen itself still
# runs natively (via the launcher); only the object store is containerized.
services:
  minio:
    build:
      context: ../../test/support/minio
      target: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

  mc:
    profiles: ["tools"]
    build:
      context: ../../test/support/minio
      target: mc
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
