{{- if and .Values.provisioning.enabled .Values.provisioning.document }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "suxen.fullname" . }}-provisioning
  labels:
    {{- include "suxen.labels" . | nindent 4 }}
data:
  {{ .Values.provisioning.configMapKey }}: |
    {{- .Values.provisioning.document | nindent 4 }}
{{- end }}
