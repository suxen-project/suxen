{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "suxen.fullname" . }}
  labels:
    {{- include "suxen.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "suxen.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.serviceMonitor.bearerTokenSecret.name }}
          key: {{ .Values.serviceMonitor.bearerTokenSecret.key }}
{{- end }}
